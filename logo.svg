<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Physics-aware MTL-PINN ? architecture and parameter generalization</title>
  <desc id="desc">Multi-head PINN with shared backbone and voter network; training parameters on an axis with interpolation inside and extrapolation outside the training range.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071525"/>
      <stop offset="100%" stop-color="#123552"/>
    </linearGradient>
    <linearGradient id="shared" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="interp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.15"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="480" rx="24" fill="url(#bg)"/>

  <!-- Section labels -->
  <text x="32" y="40" fill="#e2e8f0" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0.08em">MULTI-HEAD PINN + VOTER</text>
  <text x="32" y="268" fill="#e2e8f0" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0.08em">PARAMETER ? ? INTERPOLATION vs EXTRAPOLATION</text>

  <!-- Divider -->
  <line x1="32" y1="248" x2="608" y2="248" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- ===================== NEURAL ARCHITECTURE (top) ===================== -->

  <!-- Inputs -->
  <g font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
    <rect x="40" y="88" width="52" height="28" rx="6" fill="#1e3a5f" stroke="#64748b" stroke-width="1.5"/>
    <text x="66" y="107" text-anchor="middle">x</text>
    <rect x="40" y="128" width="52" height="28" rx="6" fill="#1e3a5f" stroke="#64748b" stroke-width="1.5"/>
    <text x="66" y="147" text-anchor="middle">t</text>
    <rect x="40" y="168" width="52" height="28" rx="6" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
    <text x="66" y="187" text-anchor="middle">?</text>
  </g>

  <!-- Input connector lines -->
  <path d="M92 102 L128 120 M92 142 L128 132 M92 182 L128 144" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Shared backbone -->
  <g filter="url(#soft)">
    <rect x="128" y="96" width="44" height="36" rx="8" fill="url(#shared)" opacity="0.95"/>
    <rect x="128" y="140" width="44" height="36" rx="8" fill="url(#shared)" opacity="0.85"/>
    <rect x="128" y="184" width="44" height="36" rx="8" fill="url(#shared)" opacity="0.75"/>
  </g>
  <text x="150" y="78" text-anchor="middle" fill="#5eead4" font-family="system-ui,sans-serif" font-size="12" font-weight="700">SHARED</text>
  <text x="150" y="232" text-anchor="middle" fill="#5eead4" font-family="system-ui,sans-serif" font-size="11" font-weight="600">BACKBONE</text>

  <!-- Fork to heads -->
  <path d="M172 132 L220 72 M172 148 L220 120 M172 164 L220 168 M172 180 L220 216" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Task-specific heads -->
  <g>
    <circle cx="248" cy="72" r="22" fill="url(#head)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle cx="248" cy="120" r="22" fill="url(#head)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle cx="248" cy="168" r="22" fill="url(#head)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle cx="248" cy="216" r="22" fill="url(#head)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.35"/>
    <text x="248" y="77" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="11" font-weight="800">h?</text>
    <text x="248" y="125" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="11" font-weight="800">h?</text>
    <text x="248" y="173" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="11" font-weight="800">h?</text>
    <text x="248" y="221" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="11" font-weight="800">h?</text>
  </g>
  <text x="300" y="148" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="12" font-weight="700">HEADS</text>

  <!-- Head outputs to voter -->
  <path d="M270 72 L340 132 M270 120 L340 136 M270 168 L340 140 M270 216 L340 144" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Voter / attention network -->
  <g>
    <rect x="340" y="108" width="88" height="72" rx="14" fill="#0f2744" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="384" y="138" text-anchor="middle" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="13" font-weight="800">VOTER</text>
    <text x="384" y="158" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10" font-weight="600">attention</text>
    <!-- softmax weights hint -->
    <text x="384" y="172" text-anchor="middle" fill="#fbbf24" font-family="ui-monospace,monospace" font-size="9">?????</text>
  </g>

  <!-- ? feeds voter (parameter conditioning) -->
  <path d="M66 182 C120 182, 300 200, 340 168" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="5 4" opacity="0.85"/>
  <text x="200" y="198" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="10" font-weight="600">? conditions weights</text>

  <!-- Weighted sum ? output -->
  <path d="M428 144 L468 144" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="500" cy="144" r="28" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" fill="#eff6ff" font-family="system-ui,sans-serif" font-size="14" font-weight="800">u(x,t;?)</text>
  <text x="500" y="158" text-anchor="middle" fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="9">solution</text>

  <!-- PDE residual bracket -->
  <path d="M528 96 L560 96 Q580 96 580 144 Q580 192 560 192 L528 192" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 5" opacity="0.8"/>
  <text x="592" y="148" fill="#f9a8d4" font-family="system-ui,sans-serif" font-size="10" font-weight="700" transform="rotate(90 592 148)">PDE</text>

  <!-- Training strategy badges -->
  <g font-family="system-ui,sans-serif" font-size="10" font-weight="700">
    <rect x="430" y="56" width="88" height="22" rx="6" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
    <text x="474" y="71" text-anchor="middle" fill="#a5f3fc">1-phase: joint</text>
    <rect x="526" y="56" width="88" height="22" rx="6" fill="#422006" stroke="#fbbf24" stroke-width="1"/>
    <text x="570" y="71" text-anchor="middle" fill="#fde68a">2-phase: heads?voter</text>
  </g>

  <!-- ===================== ? AXIS (bottom) ===================== -->

  <!-- Axis -->
  <line x1="72" y1="380" x2="568" y2="380" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text x="580" y="385" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="18" font-weight="700">?</text>

  <!-- Extrapolation regions (outside training range) -->
  <rect x="72" y="328" width="118" height="52" rx="8" fill="#7f1d1d" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="450" y="328" width="118" height="52" rx="8" fill="#7f1d1d" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Interpolation region (between training ?) -->
  <rect x="190" y="328" width="260" height="52" rx="8" fill="url(#interp)" stroke="#4ade80" stroke-width="2"/>

  <!-- Region labels -->
  <text x="131" y="356" text-anchor="middle" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="11" font-weight="800">EXTRAPOLATION</text>
  <text x="131" y="372" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="9" font-weight="600">? outside range</text>
  <text x="320" y="356" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="11" font-weight="800">INTERPOLATION</text>
  <text x="320" y="372" text-anchor="middle" fill="#bbf7d0" font-family="system-ui,sans-serif" font-size="9" font-weight="600">strong generalization</text>
  <text x="509" y="356" text-anchor="middle" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="11" font-weight="800">EXTRAPOLATION</text>
  <text x="509" y="372" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="9" font-weight="600">limited accuracy</text>

  <!-- Training task points ????? -->
  <g>
    <circle cx="210" cy="380" r="11" fill="#f97316" stroke="#fff" stroke-width="2"/>
    <circle cx="270" cy="380" r="11" fill="#f97316" stroke="#fff" stroke-width="2"/>
    <circle cx="330" cy="380" r="11" fill="#f97316" stroke="#fff" stroke-width="2"/>
    <circle cx="390" cy="380" r="11" fill="#f97316" stroke="#fff" stroke-width="2"/>
    <text x="210" y="412" text-anchor="middle" fill="#fdba74" font-family="system-ui,sans-serif" font-size="11" font-weight="700">??</text>
    <text x="270" y="412" text-anchor="middle" fill="#fdba74" font-family="system-ui,sans-serif" font-size="11" font-weight="700">??</text>
    <text x="330" y="412" text-anchor="middle" fill="#fdba74" font-family="system-ui,sans-serif" font-size="11" font-weight="700">??</text>
    <text x="390" y="412" text-anchor="middle" fill="#fdba74" font-family="system-ui,sans-serif" font-size="11" font-weight="700">??</text>
    <text x="300" y="432" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10" font-weight="600">discrete training tasks (multitask)</text>
  </g>

  <!-- Query examples -->
  <!-- Interpolation query -->
  <circle cx="300" cy="380" r="7" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="300" y1="316" x2="300" y2="368" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="308" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="10" font-weight="700">query ?*</text>

  <!-- Extrapolation queries -->
  <circle cx="110" cy="380" r="7" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <line x1="110" y1="316" x2="110" y2="368" stroke="#f87171" stroke-width="2"/>
  <circle cx="500" cy="380" r="7" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <line x1="500" y1="316" x2="500" y2="368" stroke="#f87171" stroke-width="2"/>

  <!-- Curved accuracy hint under axis -->
  <path d="M95 448 Q200 420, 320 418 T545 448" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M72 452 L190 448" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 4"/>
  <path d="M450 448 L568 452" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="4 4"/>
  <text x="320" y="456" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="9" font-weight="600">accuracy profile (paper)</text>

  <!-- Brand -->
  <text x="32" y="468" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="0.12em" opacity="0.9">MTL-PINN</text>
</svg>
